<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>티처블머신 오디오 → 마이크로비트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>티처블머신 오디오 → 마이크로비트 (USB)</h2>

  <p>1. 티처블머신 [모델 내보내기 → 업로드] 후 받은 공유 링크를 붙여넣으세요.</p>
  <input id="url" placeholder="https://teachablemachine.withgoogle.com/models/XXXXXXX/">

  <p>2. 버튼을 순서대로 누르세요.</p>
  <button id="btnSerial">① 마이크로비트 연결</button>
  <button id="btnStart">② 소리 인식 시작</button>

  <div id="status">대기 중</div>
  <div id="bars"></div>
  <div id="sent"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
